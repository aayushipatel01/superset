name: Devin scan orchestrator (manual)

# Manual "Run workflow" button that hands the whole scan-and-remediate job to a
# single Devin session. This workflow deliberately implements NO scan logic and
# NO fan-out logic of its own: it makes exactly one API call
# (POST /v3/organizations/{org_id}/sessions) and exits. Everything else —
# running the scanners, ranking findings, filing issues, spawning remediation
# child sessions, appending to the metrics store — happens inside the session,
# driven by the prompt text in .github/devin/scan-orchestrator-prompt.md.
#
# The prompt is embedded as the request's `prompt` field rather than referenced
# as a `playbook_id`, so the exact instructions a run executed are recoverable
# from this repo at that commit.

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Max remediation child sessions the orchestrator may run at once"
        required: false
        default: "5"

permissions:
  contents: read

# One orchestrator at a time. Two concurrent runs would scan the same tree and
# race each other into duplicate issues and interleaved metrics appends.
concurrency:
  group: devin-scan-orchestrator
  cancel-in-progress: false

jobs:
  launch:
    name: Launch orchestrator session
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout prompt text
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/devin
          sparse-checkout-cone-mode: false

      - name: Create Devin session
        env:
          # Credentials for this workflow's own API call. The same two values
          # are forwarded to the session as session_secrets below so the
          # orchestrator can authenticate its own calls when it spawns
          # remediation child sessions.
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          TARGET_REPO: ${{ github.repository }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DEVIN_API_KEY}" ] || [ -z "${DEVIN_ORG_ID}" ]; then
            echo "::error::DEVIN_API_KEY and DEVIN_ORG_ID must both be set as repository secrets"
            exit 1
          fi

          case "${MAX_PARALLEL}" in
            ''|*[!0-9]*)
              echo "::error::max_parallel must be a positive integer, got '${MAX_PARALLEL}'"
              exit 1
              ;;
          esac

          PROMPT_FILE=.github/devin/scan-orchestrator-prompt.md

          # The run context is appended rather than templated into the prompt
          # file so the committed text stays the single source of truth for the
          # instructions and only the per-run values vary.
          {
            cat "$PROMPT_FILE"
            printf '\n\n---\n\n## Run context (generated by GitHub Actions)\n\n'
            printf -- '- github_run_id: %s (the dispatching Actions run; your own run_id is generated per step 0)\n' "$RUN_ID"
            printf -- '- github_run_url: %s\n' "$RUN_URL"
            printf -- '- trigger_source: manual\n'
            printf -- '- target repository: %s\n' "$TARGET_REPO"
            printf -- '- max_parallel: %s — this overrides the concurrency cap in step 5; never run more than this many remediation child sessions at once.\n' "$MAX_PARALLEL"
            printf -- '- DEVIN_API_KEY and DEVIN_ORG_ID are available to this session as session secrets; use them for your own Devin API calls.\n'
          } > /tmp/prompt.md

          # jq builds the body so the prompt — which contains newlines, quotes
          # and backslashes — is escaped into a valid JSON string, and so the
          # secret values never appear in an argv the runner logs.
          jq -n \
            --rawfile prompt /tmp/prompt.md \
            --arg repo "$TARGET_REPO" \
            --arg api_key "$DEVIN_API_KEY" \
            --arg org_id "$DEVIN_ORG_ID" \
            --arg run_id "$RUN_ID" \
            '{
              prompt: $prompt,
              title: ("Scan orchestrator (manual) — run " + $run_id),
              repos: [$repo],
              tags: ["scan-orchestrator", "trigger:manual"],
              session_secrets: [
                {key: "DEVIN_API_KEY", value: $api_key, sensitive: true},
                {key: "DEVIN_ORG_ID", value: $org_id, sensitive: false}
              ],
              structured_output_required: true,
              structured_output_schema: {
                "$schema": "http://json-schema.org/draft-07/schema#",
                type: "object",
                additionalProperties: false,
                required: ["run", "sessions"],
                properties: {
                  run: {
                    type: "object",
                    additionalProperties: false,
                    required: [
                      "run_id", "trigger_source", "started_at", "finished_at",
                      "status", "findings_discovered", "issues_filed",
                      "sessions_launched", "prs_opened"
                    ],
                    properties: {
                      run_id: {type: "string"},
                      trigger_source: {type: "string"},
                      started_at: {type: "string"},
                      finished_at: {type: ["string", "null"]},
                      status: {type: "string"},
                      findings_discovered: {type: "integer"},
                      issues_filed: {type: "integer"},
                      sessions_launched: {type: "integer"},
                      prs_opened: {type: "integer"}
                    }
                  },
                  sessions: {
                    type: "array",
                    items: {
                      type: "object",
                      additionalProperties: false,
                      required: ["session_id", "run_id", "status"],
                      properties: {
                        session_id: {type: "string"},
                        run_id: {type: "string"},
                        issue_number: {type: ["integer", "null"]},
                        status: {type: "string"},
                        pr_url: {type: ["string", "null"]},
                        scan_before: {type: ["string", "number", "object", "null"]},
                        scan_after: {type: ["string", "number", "object", "null"]},
                        ci_status: {type: ["string", "null"]}
                      }
                    }
                  }
                }
              }
            }' > /tmp/body.json

          HTTP_CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/sessions" \
            -H "Authorization: Bearer ${DEVIN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Devin API returned HTTP ${HTTP_CODE}"
            jq -r '.detail // .title // .' /tmp/response.json || cat /tmp/response.json
            exit 1
          fi

          SESSION_ID=$(jq -r '.session_id' /tmp/response.json)
          SESSION_URL=$(jq -r '.url' /tmp/response.json)
          echo "Created session ${SESSION_ID}"
          {
            printf '### Devin scan orchestrator launched\n\n'
            printf -- '- session: [%s](%s)\n' "$SESSION_ID" "$SESSION_URL"
            printf -- '- repo: %s\n' "$TARGET_REPO"
            printf -- '- max_parallel: %s\n' "$MAX_PARALLEL"
          } >> "$GITHUB_STEP_SUMMARY"
